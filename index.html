<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>めぐろ財政ナビ ＡＩひろこ</title>
<style>
:root{
  --accent:#3D8DFF; --ink:#111; --body:#222; --muted:#666A73;
  --rule:#D5D8DE; --tint:#EAF5FB; --deep:#173B55; --bg:#F7F9FC;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  background:var(--bg);color:var(--body);overflow:hidden}
#app{display:grid;grid-template-columns:minmax(300px,34%) 1fr;height:100vh;height:100dvh;overflow:hidden}

/* ── 左：アバター ── */
#stage{position:relative;min-height:0;background:linear-gradient(180deg,#E9F2FD 0%,#F7F9FC 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
#avatar{width:92%;max-width:460px;max-height:78%;object-fit:contain;object-position:bottom;margin-bottom:-2%;
  filter:drop-shadow(0 12px 24px rgba(23,59,85,.12));
  transition:opacity .12s ease;transform-origin:50% 100%}
#avatar.talking{animation:bob .62s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.012)}}
#nameplate{position:absolute;top:22px;left:22px}
#nameplate .n{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.02em}
#nameplate .s{font-size:11.5px;font-weight:700;color:var(--accent);margin-top:3px;letter-spacing:.06em}
#bubble{position:absolute;top:96px;left:22px;right:22px;background:#fff;border:1px solid var(--rule);
  border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:var(--deep);
  box-shadow:0 6px 18px rgba(23,59,85,.07);display:none}
#bubble.show{display:block}

/* ── 右：会話 ── */
#panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border-left:1px solid var(--rule)}
header{padding:18px 26px 14px;border-bottom:1px solid var(--rule);display:flex;
  align-items:center;gap:14px;flex:0 0 auto}
header h1{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
header .tag{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);
  border-radius:99px;padding:3px 10px}
header .sp{flex:1}
button.ghost{border:1px solid var(--rule);background:#fff;color:var(--muted);border-radius:8px;
  padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
button.ghost.on{border-color:var(--accent);color:#fff;background:var(--accent)}

#log{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 26px;scroll-behavior:smooth}
.msg{max-width:min(760px,94%);margin-bottom:18px;line-height:1.8;font-size:16px;
  white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px;
  padding:12px 16px;font-weight:500}
.msg.ai{background:#fff;border:1px solid var(--rule);border-radius:16px 16px 16px 4px;
  padding:14px 18px;color:var(--body)}
.msg.ai strong{color:var(--ink)}
.msg.sys{font-size:13px;color:var(--muted);background:#FFF6F5;border:1px solid #F3C9C4;
  border-radius:10px;padding:10px 14px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;
  background:var(--rule);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}


/* 図 */
.fig{margin:14px 0 4px;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;background:#fff}
.fig h4{margin:0 0 3px;font-size:14.5px;color:var(--ink)}
.fig .note{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.fig .pts{margin-top:10px;background:var(--tint);border-radius:9px;padding:10px 13px}
.fig .pts b{font-size:12px;color:var(--deep)}
.fig .pts ul{margin:5px 0 0;padding-left:18px}
.fig .pts li{font-size:12.5px;color:var(--deep);line-height:1.75}
.fig .src{font-size:10.5px;color:var(--muted);margin-top:6px}
.fig .row{display:flex;align-items:center;gap:10px;margin:7px 0}
.fig .row .lb{flex:0 0 116px;font-size:12px;color:var(--body);text-align:right}
.fig .row .track{flex:1;background:#F0F3F7;border-radius:5px;height:20px;position:relative}
.fig .row .bar{height:100%;border-radius:5px;background:var(--accent)}
.fig .row .vl{flex:0 0 78px;font-size:12.5px;font-weight:700;color:var(--deep)}
.fig table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
.fig th,.fig td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
.fig th{color:var(--muted);font-weight:700;font-size:11.5px}
.fig td.n{text-align:right;font-variant-numeric:tabular-nums}
.fig svg{width:100%;height:auto;display:block;margin-top:6px}
.fig .lg{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.fig .lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}
.fig .bs{display:flex;gap:12px;margin-top:8px}
.fig .bs .col{flex:1}
.fig .bs .cap{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.fig .bs .seg{color:#fff;font-size:11px;font-weight:700;padding:5px 8px;border-radius:4px;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.ai table{border-collapse:collapse;margin:10px 0;font-size:13.5px}
.msg.ai th,.msg.ai td{border:1px solid var(--rule);padding:6px 10px}
.msg.ai th{background:#F5F8FC;font-weight:700;color:var(--ink)}

#figbar{padding:0 26px 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:0 0 auto}
#figbar .cap{font-size:11.5px;font-weight:700;color:var(--muted);margin-right:2px}
#figbar button{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:6px 11px;
  font-size:12px;color:var(--deep);cursor:pointer;font-family:inherit}
#figbar button:hover{border-color:var(--accent);background:var(--tint)}
#chips{padding:0 26px 12px;display:flex;flex-wrap:wrap;gap:8px;flex:0 0 auto}
#chips button{border:1px solid var(--rule);background:#fff;border-radius:99px;padding:8px 14px;
  font-size:13px;color:var(--deep);cursor:pointer;font-family:inherit}
#chips button:hover{border-color:var(--accent);background:var(--tint)}
#chips button.more{color:var(--accent);border-style:dashed}

#composer{display:flex;gap:10px;padding:14px 26px 20px;border-top:1px solid var(--rule);flex:0 0 auto}
#q{flex:1;border:1px solid var(--rule);border-radius:12px;padding:13px 16px;font-size:16px;
  font-family:inherit;outline:none;color:var(--ink)}
#q:focus{border-color:var(--accent)}
#send{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 24px;font-size:15px;
  font-weight:700;cursor:pointer;font-family:inherit}
#send:disabled{background:var(--rule);cursor:default}

/* ── 設定 ── */
#setup{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;
  justify-content:center;z-index:20}
#setup.hide{display:none}
#setup .card{background:#fff;border-radius:16px;padding:30px 32px;width:min(520px,92vw);
  box-shadow:0 20px 50px rgba(0,0,0,.2)}
#setup h2{margin:0 0 6px;font-size:19px;color:var(--ink)}
#setup p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.7}
#setup label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin:14px 0 6px}
#setup input{width:100%;border:1px solid var(--rule);border-radius:9px;padding:11px 13px;
  font-size:14px;font-family:inherit;outline:none}
#setup input:focus{border-color:var(--accent)}
#setup .go{margin-top:22px;width:100%;border:0;background:var(--accent);color:#fff;border-radius:10px;
  padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#setup .note{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.7}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:22vh 1fr}
  #panel{border-left:0;border-top:1px solid var(--rule)}
  #bubble{display:none!important}
  #nameplate{top:12px;left:14px}
  #nameplate .n{font-size:16px}
  #avatar{max-height:100%;width:auto;margin-bottom:0}
  header{padding:12px 16px 10px}
  header h1{font-size:14px}
  #log{padding:14px 16px}
  .msg{font-size:15px}
  #figbar,#chips{padding-left:16px;padding-right:16px}
  #chips button{font-size:13.5px;padding:9px 14px}
  #composer{padding:10px 16px 14px}
  #q{font-size:16px}          /* 16px 未満だと iOS が拡大してしまう */
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="nameplate">
      <div class="n">ＡＩひろこ</div>
      <div class="s">めぐろ財政ナビ</div>
    </div>
    <div id="bubble"></div>
    <img id="avatar" src="img/neutral.png" alt="AIひろこ">
  </div>

  <div id="panel">
    <header>
      <h1>目黒区の財政を、いっしょに見てみましょう</h1>
      <span class="tag">デモ版</span>
      <span class="sp"></span>
      <button class="ghost" id="voice" hidden>音声 OFF</button>
      <button class="ghost" id="reset">はじめから</button>
      <button class="ghost" id="conf" hidden>設定</button>
    </header>
    <div id="log"></div>
    <div id="figbar"></div>
    <div id="chips"></div>
    <div id="composer">
      <input id="q" placeholder="例：図書館で本を1冊借りると、税金はいくら？" autocomplete="off">
      <button id="send">送る</button>
    </div>
  </div>
</div>

<div id="setup">
  <div class="card">
    <h2>Dify との接続</h2>
    <p>Dify の「アクセスポイント → APIキー」で発行した <code>app-</code> で始まるキーを貼ってください。
       キーはこのブラウザにのみ保存され、どこにも送信されません。</p>
    <label>API キー</label>
    <input id="k" type="password" placeholder="app-xxxxxxxxxxxxxxxxxxxx">
    <label>API サーバー</label>
    <input id="u" value="https://api.dify.ai/v1">
    <button class="go" id="save">はじめる</button>
    <div class="note">ブラウザから直接呼べない（CORS エラーになる）場合は、同じフォルダの
      <code>proxy.py</code> を <code>python3 proxy.py</code> で起動し、API サーバーを
      <code>http://localhost:8788/v1</code> にしてください。</div>
  </div>
</div>

<script src="config.local.js" onerror="void 0"></script>
<script src="charts.js" onerror="void 0"></script>
<script>
const EMO = { "正面":"neutral", "いいね":"good", "なるほど":"think",
              "うーん":"worry", "びっくり":"surprised" };
const $ = s => document.querySelector(s);
const log = $("#log"), avatar = $("#avatar"), bubble = $("#bubble");
const LOCAL = window.HIROKO_CONFIG || {};      // config.local.js があればそれを使う
let cfg = { key: LOCAL.key || localStorage.getItem("hiroko.key") || "",
            url: LOCAL.url || localStorage.getItem("hiroko.url") || "https://api.dify.ai/v1" };
let convId = "", speaking = false, voiceOn = false;

const CHIPS = [
  "目黒区の借金は多いの？",
  "将来の税金って何？いくら？",
  "図書館で本を1冊借りると税金はいくら？",
  "住民票1通にいくらかかっているの？",
  "なぜ「1人あたり」ではなく「本1冊あたり」で見せるの？",
  "区長は財政運営に失敗しているの？"
];

function setEmotion(name){
  const next = "img/" + (EMO[name] || "neutral") + ".png";
  if(avatar.getAttribute("src") === next) return;
  avatar.style.opacity = 0;
  setTimeout(() => { avatar.src = next; avatar.style.opacity = 1; }, 110);
}

function add(cls, html){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function esc(s){
  return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

// ── 図の描画（数字は charts.js に固定。AIは [図:キー] と書くだけ）
const CHARTS = window.HIROKO_CHARTS || {};
const esc2 = t => String(t).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const nf = n => Number(n).toLocaleString("ja-JP");

function figBars(c){
  const max = c.max || Math.max(...c.data.map(d => d.value)) * 1.08;
  return c.data.map(d => `<div class="row"><div class="lb">${esc2(d.label)}</div>
    <div class="track"><div class="bar" style="width:${(d.value / max * 100).toFixed(1)}%"></div></div>
    <div class="vl">${nf(d.value)}${esc2(c.unit || "")}</div></div>`).join("");
}

function figLines(c){
  const W = 520, H = 200, P = 34;
  const all = c.series.flatMap(s => s.data);
  const max = Math.max(...all) * 1.12, n = c.x.length;
  const X = i => P + i * (W - P * 2) / (n - 1);
  const Y = v => H - 24 - (v / max) * (H - 48);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k = 0; k <= 2; k++){
    const y = 24 + k * (H - 48) / 2;
    g += `<line x1="${P}" y1="${y}" x2="${W - P}" y2="${y}" stroke="#EDF0F4"/>`;
  }
  c.series.forEach(se => {
    g += `<polyline fill="none" stroke="${se.color}" stroke-width="2.5"
      points="${se.data.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`;
    se.data.forEach((v, i) => {
      g += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${se.color}"/>`;
      g += `<text x="${X(i)}" y="${Y(v) - 9}" font-size="10" fill="${se.color}"
        text-anchor="middle" font-weight="700">${nf(v)}</text>`;
    });
  });
  c.x.forEach((t, i) => {
    g += `<text x="${X(i)}" y="${H - 6}" font-size="10.5" fill="#666A73" text-anchor="middle">${esc2(t)}</text>`;
  });
  g += "</svg>";
  g += `<div class="lg">` + c.series.map(se =>
    `<span><i style="background:${se.color}"></i>${esc2(se.name)}（${esc2(c.unit)}）</span>`).join("") + `</div>`;
  return g;
}

function figStack2(c){
  const tot = Math.max(c.left.items.reduce((a, b) => a + b.value, 0),
                       c.right.items.reduce((a, b) => a + b.value, 0));
  const PAL = ["#173B55", "#3D8DFF", "#7FB4F5", "#BFD9F7"];
  const col = side => `<div class="col"><div class="cap">${esc2(side.name)}　計 ${nf(
      side.items.reduce((a, b) => a + b.value, 0))}億円</div>` +
    side.items.map((it, i) => `<div class="seg" title="${esc2(it.label)} ${nf(it.value)}億円"
      style="background:${PAL[i % PAL.length]};height:${Math.max(22, it.value / tot * 210)}px;
      display:flex;align-items:center">${esc2(it.label)} ${nf(it.value)}</div>`).join("") + `</div>`;
  return `<div class="bs">${col(c.left)}${col(c.right)}</div>`;
}

function figRank(c){
  return `<table><tr><th>指標</th><th>目黒区</th><th>全国順位</th><th>23区順位</th></tr>` +
    c.data.map(d => `<tr><td>${esc2(d.label)}</td><td class="n">${esc2(d.value)}</td>
      <td class="n">${esc2(d.national)}</td><td class="n">${esc2(d.ku)}</td></tr>`).join("") + `</table>`;
}

function figure(key){
  const c = CHARTS[key];
  if(!c) return "";
  const body = c.type === "lines" ? figLines(c)
             : c.type === "stack2" ? figStack2(c)
             : c.type === "rank" ? figRank(c)
             : figBars(c);
  const pts = (c.points || []).length
    ? `<div class="pts"><b>見るべきポイント</b><ul>` +
      c.points.map(p => `<li>${esc2(p)}</li>`).join("") + `</ul></div>` : "";
  return `<div class="fig"><h4>${esc2(c.title)}</h4>${body}` +
    (c.note ? `<p class="note">${esc2(c.note)}</p>` : "") + pts +
    `<div class="src">出典：${esc2(c.src)}</div></div>`;
}

// 本文の言葉から、関係する図を自動で選ぶ（LLMに頼らない）
const FIG_RULES = [
  ["将来の税金の推移", /将来の税金/],
  ["市民のバランスシート", /市民の(?:貸借対照表|バランスシート|BS)|払い(?:済み|終わ)/],
  ["財政計画",         /財政計画|令和11年度|取り崩/],
  ["首長のバランスシート", /首長の(?:負債|資産|貸借対照表|バランスシート|BS)|更新引当金/],
  ["サービス1回あたり", /1冊あたり|1通あたり|1件あたり|1回あたり|303円|1,099円|コンビニ交付|窓口交付/],
  ["全国での位置",     /全国\d+位|23区\d+位|順位|中央値|純資産比率/]
];
// 「資料にありません」の断り文からは図を出さない（案内文に図書館などが出てくるため）
const REFUSAL = /手元の資料にありません|手元にありません|お答えできません/;
function autoFigure(text){
  if(REFUSAL.test(text)) return null;
  for(const [key, re] of FIG_RULES){ if(re.test(text)) return key; }
  return null;
}

// 簡易 Markdown（表・太字・箇条書き）
function fmtRich(src){
  const lines = src.split("\n");
  let out = "", tbl = null;
  const flush = () => {
    if(!tbl) return;
    const cell = r => r.replace(/^\||\|$/g, "").split("|").map(x => x.trim());
    const head = cell(tbl[0]);
    const rows = tbl.slice(2).map(cell);
    out += "<table><tr>" + head.map(h => `<th>${fmtInline(h)}</th>`).join("") + "</tr>" +
      rows.map(r => "<tr>" + r.map(v => `<td>${fmtInline(v)}</td>`).join("") + "</tr>").join("") +
      "</table>";
    tbl = null;
  };
  for(const ln of lines){
    if(/^\s*\|.*\|\s*$/.test(ln)){ (tbl = tbl || []).push(ln.trim()); continue; }
    flush();
    out += fmtInline(ln) + "\n";
  }
  flush();
  return out.replace(/\n{3,}/g, "\n\n").trim();
}
function fmtInline(t){
  return esc2(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function say(text){
  if(!voiceOn || !window.speechSynthesis) return;
  text = text.replace(/\[図[:：][^\]]+\]/g, "");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\*\*/g, ""));
  u.lang = "ja-JP"; u.rate = 1.05; u.pitch = 1.15;
  u.onstart = () => avatar.classList.add("talking");
  u.onend = () => avatar.classList.remove("talking");
  speechSynthesis.speak(u);
}

function showBubble(text){
  text = text.replace(/\[図[:：][^\]]+\]/g, "").replace(/\*\*/g, "");
  const first = text.split(/[。\n]/).filter(Boolean)[0];
  if(!first) return;
  bubble.textContent = first.slice(0, 70) + "。";
  bubble.classList.add("show");
}

async function ask(text){
  if(!text.trim() || speaking) return;
  const wantFig = /図表|図で|図に|グラフ|チャート|表で|推移|移り変わ|比べ|比較/.test(text);
  $("#q").value = "";
  add("me", esc(text));
  speaking = true; $("#send").disabled = true;
  avatar.classList.add("talking");
  const box = add("ai", '<span class="dots"><span></span><span></span><span></span></span>');
  let raw = "", shown = "", emotionDone = false;

  const render = () => {
    let t = raw;
    const m = t.match(/^\s*\[([^\]]{1,8})\]\s*/);
    if(m){
      if(!emotionDone){ setEmotion(m[1].trim()); emotionDone = true; }
      t = t.slice(m[0].length);
    }
    const figs = [];
    t = t.replace(/\[図[:：]\s*([^\]]+)\]/g, (_, k) => { figs.push(k.trim()); return ""; });
    shown = t.trim();
    box.innerHTML = (fmtRich(shown) || '<span class="dots"><span></span><span></span><span></span></span>')
      + figs.map(figure).join("");
    box.dataset.figs = figs.join(",");
    log.scrollTop = log.scrollHeight;
  };

  try{
    const res = await fetch(cfg.url.replace(/\/$/, "") + "/chat-messages", {
      method: "POST",
      headers: { "Authorization": "Bearer " + cfg.key, "Content-Type": "application/json" },
      body: JSON.stringify({
        inputs: {}, query: text, response_mode: "streaming",
        conversation_id: convId, user: "meguro-demo"
      })
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error("HTTP " + res.status + "　" + t.slice(0, 300));
    }
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while(true){
      const { done, value } = await rd.read();
      if(done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n");
      buf = parts.pop();
      for(const line of parts){
        if(!line.startsWith("data:")) continue;
        let ev; try{ ev = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
        if(ev.conversation_id) convId = ev.conversation_id;
        if(ev.event === "message" || ev.event === "agent_message"){
          raw += ev.answer || ""; render();
        }else if(ev.event === "error"){
          throw new Error(ev.message || "Dify からエラーが返りました");
        }
      }
    }
    render();
    if(shown){
      if(!box.dataset.figs && wantFig){
        const k = autoFigure(shown);
        if(k) box.insertAdjacentHTML("beforeend", figure(k));
      }
      showBubble(shown); say(shown);
    }
  }catch(err){
    box.remove();
    const cors = /Failed to fetch|NetworkError/i.test(String(err));
    add("sys", cors
      ? "ブラウザから Dify を直接呼べませんでした（CORS）。同じフォルダで <code>python3 proxy.py</code> を起動し、設定の API サーバーを <code>http://localhost:8788/v1</code> にして再試行してください。"
      : "接続できませんでした：" + esc(String(err.message || err)));
    setEmotion("うーん");
  }finally{
    speaking = false; $("#send").disabled = false;
    if(!voiceOn) avatar.classList.remove("talking");
  }
}

// ── UI 配線
function addChip(c){
  const b = document.createElement("button");
  b.textContent = c;
  b.onclick = () => ask(c);
  $("#chips").appendChild(b);
}
CHIPS_MAIN.forEach(addChip);
(function moreChips(){
  const more = document.createElement("button");
  more.textContent = "ほかの質問 ＋";
  more.className = "more";
  more.onclick = () => { more.remove(); CHIPS_MORE.forEach(addChip); };
  $("#chips").appendChild(more);
})();
(function buildFigBar(){
  const bar = $("#figbar");
  if(!Object.keys(CHARTS).length) return;
  const cap = document.createElement("span");
  cap.className = "cap"; cap.textContent = "図を見る";
  bar.appendChild(cap);
  const SHORT = { "将来の税金の推移":"将来の税金", "払い済み割合":"払い済み割合",
    "財政計画":"5年後の見通し", "首長のバランスシート":"首長のBS",
    "市民のバランスシート":"市民のBS",
    "サービス1回あたり":"1回あたりの税金", "全国での位置":"全国・23区の順位" };
  const ORDER = ["首長のバランスシート", "市民のバランスシート", "将来の税金の推移",
                 "財政計画", "サービス1回あたり", "全国での位置", "払い済み割合"];
  ORDER.filter(k => CHARTS[k]).forEach(k => {
    const b = document.createElement("button");
    b.textContent = SHORT[k] || k;
    b.onclick = () => {
      const pair = { "首長のバランスシート": "市民のバランスシート",
                     "市民のバランスシート": "首長のバランスシート" }[k];
      add("ai", figure(k) + (pair && CHARTS[pair] ? figure(pair) : ""));
      setEmotion("なるほど");
      log.scrollTop = log.scrollHeight;
    };
    bar.appendChild(b);
  });
})();

$("#send").onclick = () => ask($("#q").value);
let composing = false;
$("#q").addEventListener("compositionstart", () => { composing = true; });
$("#q").addEventListener("compositionend", () => { composing = false; });
$("#q").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(composing || e.isComposing || e.keyCode === 229) return;   // 変換確定の Enter
  e.preventDefault();
  ask($("#q").value);
});
$("#reset").onclick = () => {
  convId = ""; log.innerHTML = ""; bubble.classList.remove("show");
  setEmotion("正面"); greet();
};
$("#voice").onclick = () => {
  voiceOn = !voiceOn;
  $("#voice").textContent = "音声 " + (voiceOn ? "ON" : "OFF");
  $("#voice").classList.toggle("on", voiceOn);
  if(!voiceOn && window.speechSynthesis){ speechSynthesis.cancel(); avatar.classList.remove("talking"); }
};
$("#conf").onclick = () => {
  $("#k").value = cfg.key; $("#u").value = cfg.url;
  $("#setup").classList.remove("hide");
};
$("#save").onclick = () => {
  cfg.key = $("#k").value.trim(); cfg.url = $("#u").value.trim() || "https://api.dify.ai/v1";
  if(!cfg.key){ $("#k").focus(); return; }
  localStorage.setItem("hiroko.key", cfg.key);
  localStorage.setItem("hiroko.url", cfg.url);
  $("#setup").classList.add("hide");
  if(!log.children.length) greet();
};

// 音声は使える環境でだけ出す。設定は ?config=1 のときだけ
(function optionalButtons(){
  const sp = new URLSearchParams(location.search);
  if(sp.get("config") === "1" || !cfg.key) $("#conf").hidden = false;
  const ok = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  if(ok) $("#voice").hidden = false;
})();

function greet(){
  add("ai", "こんにちは。<strong>ＡＩひろこ</strong>です。目黒区の財政について、"
    + "公表されている資料をもとにお答えします。\n"
    + "数字には必ず出典を付けて、こちらで試算したものは「試算です」とお伝えします。\n"
    + "下のボタンから選ぶか、自由に聞いてください。");
  setEmotion("正面");
}

if(cfg.key){ $("#setup").classList.add("hide"); greet(); }
